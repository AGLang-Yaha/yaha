[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaha-harness"
version = "0.1.0"
authors = [
  { name="Kun", email="cohen_tan@hotmail.com" },
]
description = "Yet Another HArness: A lightweight agentic task execution framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "json-repair>=0.10.0",
    "pyyaml>=6.0",
    "google-genai>=0.5.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.11.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
yaha = "yaha.cli:main"

[tool.setuptools]
packages = ["yaha", "yaha.config", "yaha.core", "yaha.llm", "yaha.tools", "yaha.ui", "yaha.templates"]

[tool.setuptools.package-data]
yaha = ["templates/*", "templates/skills/**/*", "templates/obsidian/**/*", "templates/shellcopilot/*"]
